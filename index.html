<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <script>
      // Dark is the only theme. Pin it before first paint, and overwrite any
      // 'light' a visitor stored back when the header carried a theme toggle.
      (function () {
        try {
          localStorage.setItem('theme', 'dark');
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive 3GPP lab comparing KAT-verified SNOW 3G, AES-CTR, and ZUC keystreams and demonstrating the shared danger of keystream reuse."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%93%A1</text></svg>"
    />
    <title>Air Stream — crypto-lab</title>
  </head>
  <body>
    <style>
      .cl-topbar{--cl-ink:#ffd596;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem clamp(.9rem,3vw,2rem);background:#0b1512;border-bottom:1px solid #59472c;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;position:sticky;top:0;z-index:1000}
      .cl-brand{display:flex;align-items:center;gap:.8rem;text-decoration:none}
      .cl-badge{flex:0 0 auto;display:grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--accent,#ffb84d);border-radius:8px;color:var(--cl-ink);font-weight:700;font-size:.95rem;letter-spacing:.05em}
      .cl-brand-text{display:flex;flex-direction:column;line-height:1.15}
      .cl-title{color:#eafff8;font-weight:700;font-size:1.05rem;letter-spacing:.12em}
      .cl-sub{color:#83a79e;font-size:.72rem;letter-spacing:.04em}
      .cl-actions{display:flex;align-items:center;gap:.5rem}
      .cl-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .85rem;border-radius:8px;border:1px solid #9d9f96;background:transparent;color:var(--cl-ink);cursor:pointer;font:inherit;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;transition:background .15s,border-color .15s,color .15s}
      .cl-btn:hover{background:#27251f;border-color:var(--accent,#ffb84d);color:#fff}
      .cl-btn svg{width:15px;height:15px}
      .cl-skip-link{position:absolute;left:.5rem;top:-3rem;z-index:1001;padding:.55rem 1rem;border-radius:0 0 8px 8px;background:#eafff8;color:#0b1512;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-weight:700;font-size:.8rem;text-decoration:none;transition:top .15s ease}
      .cl-skip-link:focus{top:0;outline:2px solid var(--accent,#ffb84d);outline-offset:2px}
      body :is(#theme-toggle,#themeToggle,.theme-toggle,.theme-toggle-btn,[data-theme-toggle]){display:none!important}
      @media(max-width:560px){.cl-sub{display:none}.cl-btn span{display:none}.cl-btn svg{margin:0}}
      @media(pointer:coarse){.cl-btn{min-height:44px}}
      @media(pointer:coarse) and (min-width:380px){.cl-btn{min-width:44px}}
    </style>
    <a class="cl-skip-link" href="#app">Skip to content</a>
    <header class="cl-topbar" role="banner" aria-label="Crypto Lab">
      <a class="cl-brand" href="https://crypto-lab.systemslibrarian.dev/" aria-label="Crypto Lab home">
        <span class="cl-badge">CL</span>
        <span class="cl-brand-text">
          <span class="cl-title">CRYPTO LAB</span>
          <span class="cl-sub">systemslibrarian.dev</span>
        </span>
      </a>
      <nav class="cl-actions" aria-label="Crypto Lab navigation">
        <a class="cl-btn" href="https://crypto-lab.systemslibrarian.dev/" aria-label="Crypto Lab menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <span>Menu</span>
        </a>
        <a class="cl-btn" href="https://github.com/systemslibrarian/crypto-lab-air-stream" target="_blank" rel="noopener" aria-label="View this project on GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7 0-.7 0-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.3 5 18.3 5.3 18.3 5.3c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
          <span>GitHub</span>
        </a>
      </nav>
    </header>
    <div id="app" tabindex="-1">
      <p class="boot-status" role="status">Loading verified cipher modules…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
